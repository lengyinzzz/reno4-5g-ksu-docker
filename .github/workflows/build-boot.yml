name: build-boot

# ============================================================================
# 云端编译 OPPO Reno4 5G (PDPM00 / SM7250 lito) 4.19.157 + KernelSU 内核，
# 用原厂 boot.img 替换内核重打包，一次产出两个可刷的 boot.img：
#
#   enforcing   SELinux 严格（KSU 策略注入成功则保持 Enforcing，失败才回退）
#   permissive  SELinux 宽容（编入 KSU_FORCE_PERMISSIVE，启动后强制 setenforce 0）
#
# 不出 AnyKernel3 zip。
#
# 原厂 boot.img 从哪来（按顺序自动找）：
#   1. 仓库里的 boot/stock_boot.img
#   2. 本仓库 Release 里叫 stock_boot*.img 的 asset（含 draft）
#   4. Secrets: KSU_STOCK_BOOT_B64
#   4. Secrets: KSU_STOCK_BOOT_B64
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（留空 = 日期-短SHA）"
        required: false
        default: ""
      variant:
        description: "构建哪个变体"
        type: choice
        options:
          - both
          - enforcing
          - permissive
          - noksu
          - docker
          - docker_a
          - docker_b
          - docker_c
          - docker_d
          - docker_e
          - docker_f
          - all
        default: both
      upload_release:
        description: "构建完成后发布到 Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag（upload_release 打开时用；留空则用版本号）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # runner 内存约 7 G，-j3 稳一些；想更快可改 4
  JOBS: "3"
  KSU_EXPECTED_VERSION: "32584"

jobs:
  prepare:
    name: 计算版本号
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="$(date +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

  build:
    name: ${{ matrix.variant }} 变体
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    concurrency:
      group: build-boot-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'enforcing' && '["enforcing"]' || inputs.variant == 'permissive' && '["permissive"]' || inputs.variant == 'noksu' && '["noksu"]' || inputs.variant == 'docker' && '["docker"]' || inputs.variant == 'docker_a' && '["docker_a"]' || inputs.variant == 'docker_b' && '["docker_b"]' || inputs.variant == 'docker_c' && '["docker_c"]' || inputs.variant == 'docker_d' && '["docker_d"]' || inputs.variant == 'docker_e' && '["docker_e"]' || inputs.variant == 'docker_f' && '["docker_f"]' || inputs.variant == 'all' && '["enforcing","permissive","noksu","docker"]' || '["enforcing","permissive"]') }}

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev libelf-dev \
            cpio perl python3 kmod lz4 xz-utils zstd device-tree-compiler \
            git git-lfs curl ca-certificates unzip zip rsync file xxd
          git lfs install --skip-repo

      - name: 缓存工具链（clang-r399163b + GCC 4.9）
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-reno4-toolchain-clang-r399163b-v1

      - name: 准备源码树 / 工具链 / KernelSU（并编译）
        shell: bash
        env:
          STOCK_BOOT_URL: ${{ secrets.STOCK_BOOT_URL }}
          STOCK_BOOT_AUTH_HEADER: ${{ secrets.STOCK_BOOT_AUTH_HEADER }}
          KSU_STOCK_BOOT_B64: ${{ secrets.KSU_STOCK_BOOT_B64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/docker-build.sh boot 2>&1 | tee "build-$VARIANT.log"

      - name: 校验 KernelSU 版本
        run: |
          V="$(git -C kernel/msm-4.19/KernelSU rev-list --count HEAD 2>/dev/null || echo 0)"
          KSU_VERSION="$((30000 + V))"
          echo "KSU_VERSION=$KSU_VERSION（预期 $KSU_EXPECTED_VERSION）"
          if [ "$KSU_VERSION" != "$KSU_EXPECTED_VERSION" ]; then
            echo "::warning::KSU_VERSION=$KSU_VERSION 与仓库 pin 的 $KSU_EXPECTED_VERSION 不一致"
          fi

      - name: 列出产物
        if: always()
        run: |
          echo "== out/ =="
          ls -lh out 2>/dev/null || true
          echo
          for f in out/*.img; do
            [ -f "$f" ] || continue
            echo "$f  sha256=$(sha256sum "$f" | awk '{print $1}')"
          done

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}-${{ needs.prepare.outputs.version }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 boot.img 产物
        if: hashFiles('out/boot_*.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.variant }}-${{ needs.prepare.outputs.version }}
          path: |
            out/boot_*.img
            out/Image_${{ matrix.variant }}
            out/SHA256SUMS_${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## ${{ matrix.variant }} 变体"
            echo
            echo "- 说明：${{ matrix.variant == 'permissive' && 'SELinux 宽容（KSU_FORCE_PERMISSIVE，强制 setenforce 0）' || matrix.variant == 'noksu' && '不带 KernelSU，给 Magisk 修补用' || matrix.variant == 'docker' && '不带 KernelSU + 容器内核选项（PID_NS/IPC_NS/USER_NS）' || 'SELinux 严格（KSU 策略注入成功则保持 Enforcing）' }}"
            echo "- 版本：\`$VERSION\`"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            ls -lh out 2>/dev/null || echo "out/ 为空"
            echo '```'
            if [ -f "out/SHA256SUMS_${{ matrix.variant }}" ]; then
              echo
              echo '```'
              cat "out/SHA256SUMS_${{ matrix.variant }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 没有原厂 boot.img 时给出提示
        if: hashFiles('out/boot_*.img') == ''
        run: |
          echo "::warning::本次只编出了内核 Image，没有 boot.img —— 需要原厂 boot.img 才能重打包。"
          echo "把原厂 boot.img 放到仓库 boot/stock_boot.img，或上传成本仓库 Release 的 asset（名字 stock_boot.img），"
          echo "或配置 Secrets：STOCK_BOOT_URL / KSU_STOCK_BOOT_B64。"
          exit 0

  release:
    name: 发布 boot.img
    needs: [prepare, build]
    if: inputs.upload_release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: boot-*
          path: dl
          merge-multiple: true

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || needs.prepare.outputs.version }}
          name: Reno4 5G KSU ${{ needs.prepare.outputs.version }}
          files: |
            dl/*.img
            dl/SHA256SUMS_*
          fail_on_unmatched_files: false
          body: |
            OPPO Reno4 5G (PDPM00 / SM7250 lito) 4.19.157 + KernelSU 内核

            - 版本：${{ needs.prepare.outputs.version }}
            - 源码提交：${{ github.sha }}
            - KernelSU：KSU_VERSION=${{ env.KSU_EXPECTED_VERSION }}
            - 只替换原厂 boot.img 的内核，保留原厂 ramdisk/dtb

            两个变体，刷哪个都能测：

            | 文件 | SELinux | 说明 |
            |---|---|---|
            | `boot_*_enforcing.img` | Enforcing | KSU 策略注入成功即保持严格 |
            | `boot_*_permissive.img` | Permissive | 编入 KSU_FORCE_PERMISSIVE，启动后强制宽容 |

            刷入：`fastboot flash boot boot_*.img`；刷完 `adb shell getenforce` 确认状态。
